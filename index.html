<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>無礙導航：行動友善餐廳地圖</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  :root {
    --ink: #1c2b28;
    --paper: #f6f4ee;
    --line: #d8d3c4;
    --accent: #3d6b5c;
    --good: #4a8f6f;
    --partial: #d9a441;
    --unknown: #b7b2a3;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, "BlinkMacSystemFont", "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang TC", "Microsoft JhengHei", sans-serif;
    color: var(--ink);
    background: var(--paper);
  }

  header {
    padding: 16px 22px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
  }

  header h1 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }
  header p { margin: 2px 0 0; font-size: 13px; color: #5b5648; }

  #toolbar { display: flex; gap: 8px; align-items: center; }

  #search-input {
    padding: 8px 12px;
    border: 1px solid var(--line);
    border-radius: 6px;
    font-size: 14px;
    width: 200px;
    background: white;
  }

  button.primary, #search-btn {
    padding: 8px 14px;
    border: none;
    border-radius: 6px;
    background: var(--accent);
    color: white;
    font-size: 13.5px;
    cursor: pointer;
  }
  button.primary:hover, #search-btn:hover { background: #26594c; }

  #add-mode-btn.active { background: #b8862f; }

  #map { 
    height: calc(100vh - 64px); 
    width: 100%; 
    min-height: 400px;
    position: relative;
    z-index: 1;
  }

  /* 降低底圖預設色彩與圖示飽和度，凸顯自訂標記 */
  .leaflet-tile-pane {
    filter: grayscale(55%) brightness(1.12) contrast(0.9) saturate(0.7);
  }

  .legend {
    position: absolute;
    z-index: 500;
    bottom: 22px;
    left: 12px;
    background: rgba(246, 244, 238, 0.95);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 12.5px;
    line-height: 1.9;
  }
  .legend span.dot {
    display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 7px;
  }

  /* 滑入式詳細資訊面板 */
  #detail-panel {
    position: absolute;
    z-index: 700;
    top: 16px;
    left: 12px;
    width: 320px;
    max-width: 85vw;
    max-height: calc(100vh - 100px);
    overflow-y: auto;
    background: #fdfcf8;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(28,43,40,0.22);
    transform: translateX(-130%);
    transition: transform 0.22s ease;
  }
  #detail-panel.open { transform: translateX(0); }

  #detail-panel .dp-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 16px 16px 4px;
  }
  #detail-panel .dp-name { font-size: 17px; font-weight: 700; margin: 0; line-height: 1.3; }
  #detail-panel .dp-close {
    background: none; border: none; cursor: pointer;
    font-size: 18px; color: var(--unknown); line-height: 1;
    padding: 2px 4px;
  }
  #detail-panel .dp-status-row { padding: 2px 16px 12px; }
  #detail-panel .dp-badge {
    display: inline-block;
    font-size: 12px; font-weight: 600;
    padding: 3px 10px; border-radius: 20px;
    color: white;
  }
  #detail-panel .dp-section { padding: 10px 16px; border-top: 1px solid var(--line); }
  #detail-panel .dp-row { display: flex; gap: 10px; font-size: 13.5px; margin: 8px 0; color: #3c392f; }
  #detail-panel .dp-row .dp-icon { width: 18px; flex-shrink: 0; text-align: center; }
  #detail-panel .dp-row b { display: block; color: var(--ink); font-size: 12px; letter-spacing: 0.02em; margin-bottom: 1px; }
  #detail-panel .dp-updated { padding: 8px 16px 4px; font-size: 11.5px; color: var(--unknown); }
  #detail-panel .dp-notes { padding: 0 16px 12px; font-size: 12.5px; font-style: italic; color: #7a7565; }
  #detail-panel .dp-action {
    display: block; margin: 4px 16px 16px;
    text-align: center; padding: 9px; border-radius: 7px;
    background: var(--accent); color: white; font-size: 13.5px;
    text-decoration: none; cursor: pointer; border: none; width: calc(100% - 32px);
  }
  #detail-panel .dp-empty { padding: 4px 16px 16px; font-size: 13px; color: #7a7565; }

  .hint-banner {
    position: absolute;
    z-index: 500;
    top: 78px;
    left: 50%;
    transform: translateX(-50%);
    background: #b8862f;
    color: white;
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 13px;
    display: none;
  }

  /* 彈出式表單 Modal */
  #overlay {
    display: none;
    position: fixed; inset: 0; background: rgba(28,43,40,0.4);
    z-index: 1000; align-items: center; justify-content: center;
  }
  #form-card {
    background: white; border-radius: 10px; padding: 22px 24px;
    width: 340px; max-width: 90vw; box-shadow: 0 8px 30px rgba(0,0,0,0.25);
  }
  #form-card h2 { font-size: 16px; margin: 0 0 4px; }
  #form-card p.sub { font-size: 12.5px; color: #7a7565; margin: 0 0 14px; }
  #form-card label {
    display: block; font-size: 12.5px; font-weight: 600; margin: 10px 0 4px;
  }
  #form-card input, #form-card select, #form-card textarea {
    width: 100%; padding: 7px 9px; border: 1px solid var(--line);
    border-radius: 6px; font-size: 13.5px; font-family: inherit;
  }
  #form-card textarea { resize: vertical; min-height: 44px; }
  .form-actions { margin-top: 16px; display: flex; gap: 8px; justify-content: flex-end; }
  .form-actions button.cancel {
    background: none; border: 1px solid var(--line); border-radius: 6px;
    padding: 8px 14px; font-size: 13px; cursor: pointer; color: var(--ink);
  }
</style>
</head>
<body>

<header>
  <div>
    <h1>無礙導航：行動友善餐廳地圖</h1>
    <p>無界同行</p>
  </div>
  <div id="toolbar">
    <input id="search-input" type="text" placeholder="搜尋地點" />
    <button id="search-btn">搜尋</button>
    <button id="add-mode-btn" class="primary">+ 新增地點</button>
  </div>
</header>

<div id="map"></div>

<div id="detail-panel">
  <div class="dp-header">
    <h2 class="dp-name" id="dp-name">—</h2>
    <button class="dp-close" id="dp-close">✕</button>
  </div>
  <div id="dp-body"></div>
</div>

<div class="hint-banner" id="hint-banner">點擊地圖任意位置以放置標記</div>

<div class="legend">
  <div><span class="dot" style="background:var(--good)"></span>確認無障礙</div>
  <div><span class="dot" style="background:var(--partial)"></span>部分無障礙</div>
  <div><span class="dot" style="background:var(--unknown)"></span>尚無資訊</div>
</div>

<!-- 新增/編輯地點表單 -->
<div id="overlay">
  <div id="form-card">
    <h2>新增無障礙資訊</h2>
    <p class="sub">資料將儲存至您的範例資料庫，下次開啟此頁面時依然存在。</p>
    <label>地點名稱</label>
    <input id="f-name" type="text" placeholder="例如：捷運西門站 6 號出口" />
    <label>整體無障礙狀況</label>
    <select id="f-status">
      <option value="good">確認無障礙</option>
      <option value="partial">部分無障礙</option>
      <option value="unknown">尚無資訊</option>
    </select>
    <label>入口設施</label>
    <input id="f-entrance" type="text" placeholder="例如：側門設有無障礙斜坡" />
    <label>無障礙廁所</label>
    <input id="f-restroom" type="text" placeholder="例如：1 樓設有無障礙廁所" />
    <label>停車設施</label>
    <input id="f-parking" type="text" placeholder="例如：設有 2 個無障礙車位" />
    <label>備註說明</label>
    <textarea id="f-notes" placeholder="其他值得注意的詳細資訊"></textarea>
    <div class="form-actions">
      <button class="cancel" id="f-cancel">取消</button>
      <button class="primary" id="f-save">儲存地點</button>
    </div>
  </div>
</div>

<script>
  window.addEventListener('DOMContentLoaded', () => {
    // ===== 請填入 Supabase 專案資訊 =====
    const SUPABASE_URL = "PASTE_YOUR_SUPABASE_PROJECT_URL_HERE";
    const SUPABASE_ANON_KEY = "PASTE_YOUR_SUPABASE_ANON_KEY_HERE";

    // 安全檢查 Supabase 套件，避免 CDN 載入失敗導致 JS 卡死
    const supabaseClient = (typeof supabase !== "undefined" && SUPABASE_URL.startsWith("http"))
      ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
      : null;

    const colors = { good: "#4a8f6f", partial: "#d9a441", unknown: "#b7b2a3" };

    if (typeof L === 'undefined') {
      alert("Leaflet 地圖套件載入失敗，請確認網路連線。");
      return;
    }

    // 預設示範資料
    const seedPlaces = [
      {
        id: "seed-1",
        name: "台北 101",
        lat: 25.0339, lng: 121.5645,
        status: "good",
        entrance: "主要入口無階梯，設有自動門",
        restroom: "B1 及觀景台樓層設有無障礙廁所",
        parking: "地下停車場設有無障礙停車位",
        notes: "示範資料 — 尚未實地驗證。",
        lastUpdated: "2026-08-14"
      },
      {
        id: "seed-2",
        name: "中正紀念堂",
        lat: 25.0347, lng: 121.5216,
        status: "good",
        entrance: "主廣場層設有無障礙斜坡道",
        restroom: "主堂體附近設有無障礙廁所",
        parking: "自由廣場附近設有無障礙停車位",
        notes: "示範資料 — 尚未實地驗證。",
        lastUpdated: "2026-07-30"
      },
      {
        id: "seed-3",
        name: "西門町商圈",
        lat: 25.0421, lng: 121.5079,
        status: "partial",
        entrance: "多數路段無階梯，部分店家有高起門檻",
        restroom: "西門紅樓附近設有公用無障礙廁所",
        parking: "行人徒步區內無專用無障礙停車位",
        notes: "示範資料 — 尚未實地驗證。",
        lastUpdated: "2026-06-02"
      },
      {
        id: "seed-4",
        name: "大安森林公園",
        lat: 25.0264, lng: 121.5352,
        status: "good",
        entrance: "設有多處無障礙平坦入口",
        restroom: "園區內多處設有無障礙廁所",
        parking: "捷運出口附近設有無障礙停車位",
        notes: "示範資料 — 尚未實地驗證。",
        lastUpdated: "2026-08-01"
      },
      {
        id: "seed-5",
        name: "台北車站",
        lat: 25.0478, lng: 121.5170,
        status: "unknown",
        entrance: "尚無回報",
        restroom: "尚無回報",
        parking: "尚無回報",
        notes: "",
        lastUpdated: null
      }
    ];

    let places = [];
    let addMode = false;
    let pendingLatLng = null;

    function makeIcon(status) {
      const color = colors[status] || colors.unknown;
      return L.divIcon({
        className: "",
        html: `<div style="width:14px;height:14px;border-radius:50%;background:${color};border:2.5px solid #fdfcf8;box-shadow:0 1px 4px rgba(28,43,40,0.35);"></div>`,
        iconSize: [14, 14],
        iconAnchor: [7, 7]
      });
    }

    function makeSearchResultIcon() {
      return L.divIcon({
        className: "",
        html: `<div style="width:14px;height:14px;border-radius:50% 50% 50% 0;background:#3d6b5c;transform:rotate(-45deg);border:2px solid #fdfcf8;box-shadow:0 1px 4px rgba(28,43,40,0.4);"></div>`,
        iconSize: [14, 14],
        iconAnchor: [7, 12]
      });
    }

    // 初始化地圖
    const map = L.map("map", { zoomControl: true }).setView([25.0375, 121.535], 13);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> 貢獻者'
    }).addTo(map);

    // 強制更新地圖尺寸校正
    setTimeout(() => { map.invalidateSize(); }, 250);

    let markerLayer = L.layerGroup().addTo(map);
    let searchResultsLayer = L.layerGroup().addTo(map);

    function renderMarkers() {
      markerLayer.clearLayers();
      places.forEach(place => {
        const marker = L.marker([place.lat, place.lng], { icon: makeIcon(place.status) });
        marker.on("click", () => showPlacePanel(place));
        marker.addTo(markerLayer);
      });
    }

    const statusLabels = { good: "確認無障礙", partial: "部分無障礙", unknown: "尚無資訊" };

    function showPlacePanel(place) {
      document.getElementById("dp-name").textContent = place.name;
      const updatedText = place.lastUpdated
        ? `最近確認日期：${place.lastUpdated}`
        : "尚無回報紀錄 — 成為第一個新增資訊的人吧";
      const notesHtml = place.notes ? `<div class="dp-notes">${place.notes}</div>` : "";
      const hasInfo = place.entrance !== "尚無回報" || place.restroom !== "尚無回報";

      document.getElementById("dp-body").innerHTML = `
        <div class="dp-status-row">
          <span class="dp-badge" style="background:${colors[place.status] || colors.unknown}">${statusLabels[place.status] || statusLabels.unknown}</span>
        </div>
        <div class="dp-section">
          <div class="dp-row"><span class="dp-icon">🚪</span><span><b>入口設施</b>${place.entrance}</span></div>
          <div class="dp-row"><span class="dp-icon">🚻</span><span><b>無障礙廁所</b>${place.restroom}</span></div>
          <div class="dp-row"><span class="dp-icon">🅿️</span><span><b>停車設施</b>${place.parking}</span></div>
        </div>
        <div class="dp-updated">${updatedText}</div>
        ${notesHtml}
        <button class="dp-action" id="dp-add-btn">${hasInfo ? "提供更新建議" : "+ 新增無障礙資訊"}</button>
      `;
      document.getElementById("dp-add-btn").addEventListener("click", () => {
        pendingLatLng = L.latLng(place.lat, place.lng);
        openForm();
        document.getElementById("f-name").value = place.name;
      });
      document.getElementById("detail-panel").classList.add("open");
      map.panTo([place.lat, place.lng]);
    }

    document.getElementById("dp-close").addEventListener("click", () => {
      document.getElementById("detail-panel").classList.remove("open");
    });

    async function loadPlaces() {
      if (!supabaseClient) {
        places = seedPlaces;
        renderMarkers();
        return;
      }
      const { data, error } = await supabaseClient
        .from("places")
        .select("*")
        .eq("approved", true);

      if (error) {
        console.error("無法載入地點資料：", error);
        places = seedPlaces;
      } else {
        places = data.map(p => ({
          id: p.id,
          name: p.name,
          lat: p.lat,
          lng: p.lng,
          status: p.status,
          entrance: p.entrance,
          restroom: p.restroom,
          parking: p.parking,
          notes: p.notes,
          lastUpdated: p.last_updated
        }));
      }
      renderMarkers();
    }

    async function submitPlace(newPlace) {
      if (!supabaseClient) {
        places.push(newPlace);
        renderMarkers();
        alert("示範模式：此地點僅於本地端暫存顯示。請連接 Supabase 以正式儲存至雲端。");
        return;
      }
      const { error } = await supabaseClient.from("places").insert({
        name: newPlace.name,
        lat: newPlace.lat,
        lng: newPlace.lng,
        status: newPlace.status,
        entrance: newPlace.entrance,
        restroom: newPlace.restroom,
        parking: newPlace.parking,
        notes: newPlace.notes,
        last_updated: newPlace.lastUpdated,
        approved: false
      });
      if (error) {
        console.error("無法儲存地點：", error);
        alert("儲存地點時發生錯誤，詳情請查看瀏覽器主控台（Console）。");
        return;
      }
      alert("感謝您！您的提交已成功儲存，審核通過後將會對外顯示。");
    }

    loadPlaces();

    const addBtn = document.getElementById("add-mode-btn");
    const hintBanner = document.getElementById("hint-banner");
    const overlay = document.getElementById("overlay");

    addBtn.addEventListener("click", () => {
      addMode = !addMode;
      addBtn.classList.toggle("active", addMode);
      hintBanner.style.display = addMode ? "block" : "none";
    });

    map.on("click", (e) => {
      if (addMode) {
        pendingLatLng = e.latlng;
        addMode = false;
        addBtn.classList.remove("active");
        hintBanner.style.display = "none";
        openForm();
      } else {
        showIdentifyPanel(e.latlng);
      }
    });

    function renderEmptyPanel(name, latlng, addressLine) {
      document.getElementById("dp-name").textContent = name;
      const addressHtml = addressLine ? `<div class="dp-empty" style="padding-bottom:0;">${addressLine}</div>` : "";
      document.getElementById("dp-body").innerHTML = `
        <div class="dp-status-row">
          <span class="dp-badge" style="background:${colors.unknown}">尚無資訊</span>
        </div>
        ${addressHtml}
        <div class="dp-empty">目前尚無人回報此地點的無障礙詳細資訊。</div>
        <button class="dp-action" id="dp-add-btn">+ 新增無障礙資訊</button>
      `;
      document.getElementById("dp-add-btn").addEventListener("click", () => {
        pendingLatLng = latlng;
        openForm();
        document.getElementById("f-name").value = name;
      });
      document.getElementById("detail-panel").classList.add("open");
    }

    async function showIdentifyPanel(latlng) {
      document.getElementById("dp-name").textContent = "查詢中…";
      document.getElementById("dp-body").innerHTML = "";
      document.getElementById("detail-panel").classList.add("open");

      let name = "未命名地點";
      try {
        const res = await fetch(
          `https://nominatim.openstreetmap.org/reverse?format=json&lat=${latlng.lat}&lon=${latlng.lng}&zoom=18`
        );
        const data = await res.json();
        if (data.display_name) name = data.display_name.split(",").slice(0, 2).join(",");
      } catch (err) {}

      renderEmptyPanel(name, latlng);
    }

    function openForm() {
      document.getElementById("f-name").value = "";
      document.getElementById("f-status").value = "unknown";
      document.getElementById("f-entrance").value = "";
      document.getElementById("f-restroom").value = "";
      document.getElementById("f-parking").value = "";
      document.getElementById("f-notes").value = "";
      overlay.style.display = "flex";
    }

    document.getElementById("f-cancel").addEventListener("click", () => {
      overlay.style.display = "none";
      pendingLatLng = null;
    });

    document.getElementById("f-save").addEventListener("click", async () => {
      const name = document.getElementById("f-name").value.trim();
      if (!name || !pendingLatLng) {
        alert("請輸入地點名稱。");
        return;
      }
      const newPlace = {
        id: "place-" + Date.now(),
        name,
        lat: pendingLatLng.lat,
        lng: pendingLatLng.lng,
        status: document.getElementById("f-status").value,
        entrance: document.getElementById("f-entrance").value.trim() || "未說明",
        restroom: document.getElementById("f-restroom").value.trim() || "未說明",
        parking: document.getElementById("f-parking").value.trim() || "未說明",
        notes: document.getElementById("f-notes").value.trim(),
        lastUpdated: new Date().toISOString().slice(0, 10)
      };
      await submitPlace(newPlace);
      overlay.style.display = "none";
      pendingLatLng = null;
    });

    function metersBetween(lat1, lng1, lat2, lng2) {
      const R = 6371000;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLng = (lng2 - lng1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) ** 2 +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLng / 2) ** 2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    async function searchPOIs(query) {
      const center = map.getCenter();
      const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      const overpassQuery = `[out:json][timeout:25];(node["name"~"${escaped}",i](around:5000,${center.lat},${center.lng});way["name"~"${escaped}",i](around:5000,${center.lat},${center.lng}););out center 40;`;

      const res = await fetch("https://overpass-api.de/api/interpreter", {
        method: "POST",
        body: "data=" + encodeURIComponent(overpassQuery)
      });
      const data = await res.json();

      return data.elements
        .map(el => {
          const lat = el.lat || (el.center && el.center.lat);
          const lng = el.lon || (el.center && el.center.lon);
          const name = el.tags && el.tags.name;
          if (!lat || !lng || !name) return null;
          const addrParts = [el.tags["addr:city"], el.tags["addr:district"], el.tags["addr:street"], el.tags["addr:housenumber"]].filter(Boolean);
          return { name, lat, lng, address: addrParts.join(" ") };
        })
        .filter(Boolean);
    }

    function showPOIPanel(poi) {
      const existing = places.find(p =>
        p.name.toLowerCase() === poi.name.toLowerCase() &&
        metersBetween(p.lat, p.lng, poi.lat, poi.lng) < 60
      );
      if (existing) {
        showPlacePanel(existing);
      } else {
        renderEmptyPanel(poi.name, L.latLng(poi.lat, poi.lng), poi.address);
      }
    }

    document.getElementById("search-btn").addEventListener("click", async () => {
      const query = document.getElementById("search-input").value.trim();
      if (!query) return;

      searchResultsLayer.clearLayers();

      const localMatches = places.filter(p => p.name.toLowerCase().includes(query.toLowerCase()));

      let poiMatches = [];
      try {
        poiMatches = await searchPOIs(query);
      } catch (err) {
        console.error("地點搜尋失敗：", err);
      }

      const newPOIs = poiMatches.filter(poi =>
        !localMatches.some(p => metersBetween(p.lat, p.lng, poi.lat, poi.lng) < 60)
      );

      newPOIs.forEach(poi => {
        const marker = L.marker([poi.lat, poi.lng], { icon: makeSearchResultIcon() });
        marker.on("click", () => showPOIPanel(poi));
        marker.addTo(searchResultsLayer);
      });

      const totalResults = localMatches.length + newPOIs.length;

      if (totalResults === 0) {
        try {
          const res = await fetch(
            `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&countrycodes=tw&limit=1`
          );
          const results = await res.json();
          if (results.length > 0) {
            const lat = parseFloat(results[0].lat);
            const lng = parseFloat(results[0].lon);
            map.setView([lat, lng], 17);
            showIdentifyPanel(L.latLng(lat, lng));
          } else {
            alert("在台灣找不到該地點，請嘗試不同的搜尋關鍵字。");
          }
        } catch (err) {
          alert("搜尋失敗 — 請檢查您的網路連線後重試。");
        }
        return;
      }

      if (totalResults === 1) {
        if (localMatches.length === 1) {
          map.setView([localMatches[0].lat, localMatches[0].lng], 17);
          showPlacePanel(localMatches[0]);
        } else {
          map.setView([newPOIs[0].lat, newPOIs[0].lng], 17);
          showPOIPanel(newPOIs[0]);
        }
        return;
      }

      const allCoords = [
        ...localMatches.map(p => [p.lat, p.lng]),
        ...newPOIs.map(p => [p.lat, p.lng])
      ];
      map.fitBounds(allCoords, { padding: [60, 60], maxZoom: 16 });
    });
  });
</script>

</body>
</html>
